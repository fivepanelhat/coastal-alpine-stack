apiVersion: apps/v1
kind: Deployment
metadata:
  name: sting-operation-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sting-ai
  template:
    metadata:
      labels:
        app: sting-ai
    spec:
      containers:
      - name: inference
        image: sting-operation-ai:latest
        env:
        - name: MODEL_PATH
          value: "/models/wasp-detector.pt"
        resources:
          requests:
            memory: "2Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1   # If using GPU nodes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: sting-operation-ai
spec:
  selector:
    app: sting-ai
  ports:
  - port: 8080
    targetPort: 8080
