name: Red Team Security Scan

on:
  push:
    branches: [ "main" ] # Triggers instantly when you push to main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./coastal_alpine_core

      - name: Execute Red Team Sanitization Scan
        run: |
          # Ensure this path matches exactly where the tool placed the script
          python -m coastal_alpine_core.prompt_guard

