name: Red Team Security Scan

on:
  push:
    branches: [ "main" ] # Triggers instantly when you push to main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any dependencies your redteam scripts need here

      - name: Execute Red Team Sanitization Scan
        run: |
          # Ensure this path matches exactly where the tool placed the script
          python coastal-alpine-core/security/prompt_guard.py
