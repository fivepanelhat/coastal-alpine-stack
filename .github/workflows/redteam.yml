
name: RedTeam Tests

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./coastal_alpine_core
          pip install bandit pip-audit

      - name: Run Bandit SAST Scan
        run: |
          bandit -r coastal_alpine_core/ -ll -ii --exit-zero

      - name: Run pip-audit Supply Chain Scan
        run: |
          pip-audit --requirement coastal_alpine_core/setup.py --skip-editable || true

      - name: Execute Red Team Sanitization Scan
        run: |
          python -m coastal_alpine_core.prompt_guard

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run ZAP baseline scan
        run: |
          zap-baseline.py -t https://example.com -g gen -r zap_report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html
