name: SecOps Scan

on:
  schedule:
    - cron: "0 */8 * * *"
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  security-scan:
    name: Comprehensive SecOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          pip install bandit gitleaks

      - name: Bandit SAST Scan
        run: bandit -r . -ll --exclude ./tests_security_stress/ || true

      - name: Gitleaks Secret Scan
        run: |
          # Install gitleaks if not available via pip
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif || true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
