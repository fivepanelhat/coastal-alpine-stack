name: Red Team Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  audit:
    name: SecOps - SAST and Prompt Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./coastal_alpine_core
          pip install bandit pip-audit

      - name: Run Bandit SAST Scan
        run: |
          bandit -r coastal_alpine_core/ -ll -ii --exit-zero

      - name: Run pip-audit Supply Chain Scan
        run: |
          pip-audit --requirement coastal_alpine_core/setup.py --skip-editable || true

      - name: Execute Red Team Sanitization Scan
        run: |
          python -m coastal_alpine_core.prompt_guard
